name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: EggscapeCore tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test --package-path Packages/EggscapeCore

  app:
    name: App build (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild -project Eggscape.xcodeproj -scheme Eggscape
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO -quiet build
