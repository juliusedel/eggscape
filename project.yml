# XcodeGen spec for Eggscape. `make gen` turns this into Eggscape.xcodeproj (git-ignored).
# Never edit the generated project by hand; change this file and regenerate.
name: Eggscape

options:
  bundleIdPrefix: de.juliusedel
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 1.0.0
    # Build numbers are bumped with agvtool (fastlane `increment_build_number`) on the generated project.
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: <TEAM_ID>
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  EggscapeCore:
    path: Packages/EggscapeCore

targets:
  Eggscape:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: EggscapeCore
    settings:
      base:
        PRODUCT_NAME: Eggscape
        PRODUCT_BUNDLE_IDENTIFIER: de.juliusedel.eggscape
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  EggscapeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EggscapeTests
    dependencies:
      - target: Eggscape
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.juliusedel.eggscape.tests

  EggscapeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EggscapeUITests
    dependencies:
      - target: Eggscape
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.juliusedel.eggscape.uitests

schemes:
  Eggscape:
    build:
      targets:
        Eggscape: all
        EggscapeTests: [test]
        EggscapeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EggscapeTests
        - EggscapeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
